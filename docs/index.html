<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KarVPN — downloads</title>
<style>
:root{--fg:#1a1c20;--muted:#6b7280;--line:#e2e5ea;--accent:#2563eb;--bg:#f7f8fa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:var(--fg);background:var(--bg);line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.9rem;margin:0}
h2{font-size:1.15rem;margin:.2rem 0 .4rem}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px}
.muted{color:var(--muted)}
header p{margin:.2rem 0 0}
.toggles{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{padding:7px 15px;border:0;background:transparent;cursor:pointer;font-size:.9rem;color:var(--fg)}
.seg button.on{background:var(--accent);color:#fff}
.ghost{padding:7px 15px;border:1px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hint{color:var(--accent);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ver{color:var(--muted);margin:.1rem 0 .3rem;font-size:.92rem}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 16px;border-radius:9px;font-weight:600;margin-top:4px}
.btn:hover{filter:brightness(1.08)}
.sha{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.68rem;color:var(--muted);word-break:break-all;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin:4px 0 8px;flex-wrap:wrap}
.tabs button{padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-size:.8rem;color:var(--fg)}
.tabs button.on{background:var(--fg);border-color:var(--fg);color:#fff}
.cmd{display:flex;align-items:center;gap:8px;background:#eef0f3;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.cmd code{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all}
.cmd button{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;padding:4px 7px;display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--fg)}
.cmd button.ok{color:#16a34a;border-color:#16a34a}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem}
footer p{margin:.3rem 0}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>KarVPN</h1>
  <p id="tagline" class="muted"></p>
  <div class="toggles">
    <div class="seg" id="seg">
      <button data-ch="stable"></button>
      <button data-ch="beta"></button>
    </div>
    <button id="langBtn" class="ghost"></button>
  </div>
</header>
<main id="cards" class="grid"></main>
<footer>
  <p><a id="footRel" href="https://github.com/KarVPN/karvpn-releases/releases"></a> · <a id="footSrc" href="https://github.com/KarVPN/karvpn-apps"></a></p>
  <p id="footNote" class="muted"></p>
</footer>
</div>
<script src="app.js"></script>
</body>
</html>
